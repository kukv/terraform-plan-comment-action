name: Terraform Plan Comment
description: Comment Terraform execution plans on pull requests

inputs:
  exitcode:
    description: 'Exit code of the plan run (with -detailed-exitcode). 0 = no changes, 2 = changes, anything else = failure'
    required: true
  plan-json:
    description: 'Path to the output of `terraform show -json <planfile>`. Relative to the workspace root, or absolute. Only read when exitcode is 2'
    required: false
    default: ''
  plan-text:
    description: 'Path to the output of `terraform show -no-color <planfile>`. Relative to the workspace root, or absolute. Only read when exitcode is 2'
    required: false
    default: ''
  error-message:
    description: 'Message to include in the comment on failure (typically the stderr output of the caller)'
    required: false
    default: ''
  github-token:
    description: 'Token used to post the comment. Requires pull-requests: write'
    required: true
  pr-number:
    description: 'Pull request number to comment on. Defaults to github.event.pull_request.number'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Build and post comment
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        EXITCODE: ${{ inputs.exitcode }}
        PLAN_JSON: ${{ inputs.plan-json }}
        PLAN_TEXT: ${{ inputs.plan-text }}
        ERROR_MESSAGE: ${{ inputs.error-message }}
        PR_NUMBER: ${{ inputs.pr-number || github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail

        comment_file="${RUNNER_TEMP}/terraform-plan-comment.md"
        footer="<sub>commit \`${COMMIT_SHA:0:7}\` · [ワークフロー実行](${RUN_URL})</sub>"

        case "$EXITCODE" in
          0)
            {
              echo '### 🏗 Terraform Plan'
              echo
              echo 'インフラに変更はありません。'
              echo
              echo "$footer"
            } > "$comment_file"
            ;;
          2)
            if [ -z "$PLAN_JSON" ] || [ -z "$PLAN_TEXT" ]; then
              echo "::error::exitcode が 2 のときは plan-json と plan-text の両方が必要です"
              exit 1
            fi

            count() {
              jq "[.resource_changes[]? | select($1)] | length" "$PLAN_JSON"
            }
            added=$(count '.change.actions == ["create"]')
            changed=$(count '.change.actions == ["update"]')
            deleted=$(count '.change.actions == ["delete"]')
            replaced=$(count '.change.actions | length > 1')
            imported=$(count '.change.importing != null')
            moved=$(count '.previous_address != null')

            {
              echo '### 🏗 Terraform Plan'
              echo
              echo '| ➕ 追加 | 🔄 変更 | ♻️ 再作成 | ➖ 削除 | 📥 インポート | 📦 移動 |'
              echo '|:--:|:--:|:--:|:--:|:--:|:--:|'
              echo "| $added | $changed | $replaced | $deleted | $imported | $moved |"
              echo
              jq -r '.resource_changes[]?
                     | select(.change.actions != ["read"])
                     | .change.actions as $a
                     | ((if .change.importing != null then "📥" else "" end)
                        + (if .previous_address != null then "📦" else "" end)
                        + (if $a == ["create"] then "➕"
                           elif $a == ["update"] then "🔄"
                           elif $a == ["delete"] then "➖"
                           elif $a == ["no-op"] then ""
                           else "♻️" end)) as $icon
                     | select($icon != "")
                     | "- " + $icon + " `"
                       + (if .previous_address != null
                          then .previous_address + "` → `" + .address
                          else .address end)
                       + "`"' "$PLAN_JSON"
              echo
              echo '<details>'
              echo '<summary>Plan の詳細</summary>'
              echo
              echo '```diff'
              sed -E 's/^([[:space:]]*)([-+~])/\2\1/' "$PLAN_TEXT"
              echo '```'
              echo
              echo '</details>'
              echo
              echo "$footer"
            } > "$comment_file"
            ;;
          *)
            {
              echo '### ❌ Terraform Plan: 失敗'
              echo
              echo '```'
              printf '%s\n' "$ERROR_MESSAGE"
              echo '```'
              echo
              echo "$footer"
            } > "$comment_file"
            ;;
        esac

        gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$comment_file"
